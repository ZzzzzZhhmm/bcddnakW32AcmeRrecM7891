# @package _global_

defaults:
  - override /data: rmbench_3cam_warm_train_dev
  - override /model: warm_robotwin
  - _self_

data:
  train:
    pretrained_norm_stats: ${data.warm_candidates.train.normalization_stats_path}
    episode_catalog_path: ${data.warm_candidates.train.catalog_path}
    episode_split: train
  val:
    pretrained_norm_stats: ${data.warm_candidates.val.normalization_stats_path}
    episode_catalog_path: ${data.warm_candidates.val.catalog_path}
    episode_split: dev

batch_size: 8
num_workers: 8
# The 45-demo specialists produce millions of overlapping windows.  A lower
# global LR reduces catastrophic drift of the pretrained Action DiT while the
# compact WARM adapters still receive thousands of updates.
learning_rate: 5.0e-5
num_epochs: 10
max_steps: null
log_every: 10
save_every: 1000
# Independent DEV loss is part of the training contract, not an optional
# smoke test.  Thirty-two deterministic task/event-stratified windows are
# enough for frequent trend detection without a simulator rollout.
eval_every: 500
eval_num_samples: 32
gradient_accumulation_steps: 1
weight_decay: 1.0e-2
resume: null
seed: 3407
sampler:
  mode: rmbench_task_event_balanced
  event_boost: 1.5

model:
  mot_checkpoint_mixed_attn: true
