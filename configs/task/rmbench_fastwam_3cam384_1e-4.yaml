# @package _global_

defaults:
  - override /data: rmbench_3cam_train_dev
  - override /model: fastwam
  - _self_

data:
  train:
    pretrained_norm_stats: ${oc.env:RMBENCH_DATASET_STATS,null}
    episode_catalog_path: ${oc.env:RMBENCH_EPISODE_CATALOG,null}
    episode_split: train
  val:
    pretrained_norm_stats: ${oc.env:RMBENCH_DATASET_STATS,null}
    episode_catalog_path: ${oc.env:RMBENCH_EPISODE_CATALOG,null}
    episode_split: dev

batch_size: 8
num_workers: 8
learning_rate: 1.0e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 0
gradient_accumulation_steps: 1
weight_decay: 1.0e-2
resume: null

model:
  mot_checkpoint_mixed_attn: true
