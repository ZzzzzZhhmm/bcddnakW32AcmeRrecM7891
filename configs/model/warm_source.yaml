defaults:
  - fastwam
  - _self_

_target_: fastwam.runtime.create_warm_source

# M2 contains only deterministic context-top1/null/oracle-upper-bound policies.
# The oracle policy is rejected by every inference/rollout entry point.
source_policy: fixed_context_top1
memory_sigma: 0.2

# Required by the formal runtime for every source policy, including the
# Gaussian-null ablation, so all comparisons start from the same baseline.
# Supply a closed-world
# warm.source-run-contract object generated from the immutable server artifacts.
# Paths are intentionally not accepted as identity; this object binds hashes.
run_contract: null
run_contract_path: null

# Required for every formal WARM training attestation, even when ``eval_every``
# is zero.  This must be a distinct warm.source-run-contract built from the
# catalog-bound dev query corpus and stride-one dev candidate cache; it may not
# reuse train identities.  Only the live dev dataset/cache paths may remain null
# while in-training evaluation is disabled.
validation_run_contract: null
validation_run_contract_path: null

# Required whenever a run contract is present. Its bytes must match the
# base_checkpoint_sha256 recorded by that contract before any weights load.
base_checkpoint_path: null

# The complete VideoDiT + ActionDiT MoT state comes only from the immutable
# base checkpoint above.  Do not partially overwrite it from factory defaults.
skip_dit_load_from_pretrain: true
action_dit_pretrained_path: null

# Source-only adaptation has no video-generation loss and freezes Video DiT.
loss:
  lambda_video: 0.0
  lambda_action: 1.0
