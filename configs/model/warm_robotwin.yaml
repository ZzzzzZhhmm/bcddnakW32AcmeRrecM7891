defaults:
  - warm
  - _self_

# DINOv2-base CLS (768) + the explicit RMBench nine-task one-hot vocabulary.
# The remaining widths are inherited from complete WARM and stay shape-derived
# from the native 14D RoboTwin processor.
retrospection:
  context_dim: 777
  semantic_dim: 768
  action_dim: 14
  action_horizon: 32
  proprio_dim: 14
  episode_action_chunk_size: 10
  # Native RoboTwin/RMBench actions are absolute 14D qpos commands.  Translate
  # the two 6D arm commands by the factual start-state offset while preserving
  # the left/right gripper commands at indices 6 and 13 exactly.
  canonical_action_mode: start_proprio_delta
  canonical_gripper_dims: [6, 13]
  # RMBench contains visually similar but phase-incompatible states.  Sharper
  # utility supervision plus more forced incompatible events teaches explicit
  # memory rejection instead of an always-on source prior.
  utility_temperature: 0.25
  gate_temperature: 0.25
  selection_temperature: 0.25
  corruption_normal_weight: 0.45
  corruption_drop_weight: 0.10
  corruption_null_weight: 0.10
  corruption_hard_negative_weight: 0.35
