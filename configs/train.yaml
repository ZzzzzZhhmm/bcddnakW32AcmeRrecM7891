# @package _global_

defaults:
  - _self_
  - data: null
  - model: null
  - task: null


output_dir: ./runs/train/${now:%Y-%m-%d}_${now:%H-%M-%S}

# dataloading
batch_size: 2
num_workers: 4

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1.0e-4
num_epochs: 1
max_steps: null
# Optional per-invocation stop limit. Unlike ``max_steps``, this does not
# shorten the optimizer/scheduler trajectory. Use it for smoke tests and
# wall-time-bounded resume segments.
run_steps: null
log_every: 10
save_every: 100
eval_every: 50
eval_num_inference_steps: 10

# training
gradient_accumulation_steps: 1
mixed_precision: "bf16" # one of: [no, fp16, bf16]
seed: 42
sampler:
  mode: random
  event_boost: 1.5
max_grad_norm: 1.0
# Never let one overflowing distributed gradient update corrupt every rank.
# The offending synchronized update is skipped; repeated failures abort with
# an explicit numerical error instead of surfacing one step later as NaN
# activations.
max_nonfinite_gradient_skips: 3
weight_decay: 0.0
resume: null

# Explicit debug escape hatch for manually synchronized server worktrees.
# When true, WARM checkpoints are saved normally but no formal
# ``.training.json`` attestation is published. Formal experiments keep false.
allow_unattested_warm_checkpoints: false

# wandb
wandb:
  enabled: false
  workspace: null
  project: fast-wam
  name: train
  group: null
  mode: online

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
